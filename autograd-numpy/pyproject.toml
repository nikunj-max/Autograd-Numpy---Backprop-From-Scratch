[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autograd-numpy"
version = "0.1.0"
description = "2-layer MLP on MNIST with every gradient hand-coded in NumPy (no autograd)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]
